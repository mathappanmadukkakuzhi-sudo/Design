<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container { padding: 40px 20px; max-width: 600px; }
        .icon { font-size: 75px; margin-bottom: 25px; }
        h1 { font-size: 36px; margin-bottom: 15px; color: #267bb6; }
        p { font-size: 17px; line-height: 1.7; color: #59666f; }
        .line {
            width: 70px; height: 4px; background: #267bb6;
            margin: 25px auto; border-radius: 5px;
        }
        footer { margin-top: 40px; font-size: 13px; color: #84919a; }
        @media (max-width: 480px) {
            h1 { font-size: 28px; }
            p { font-size: 15px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="icon" aria-hidden="true">🚧</div>
        <h1>Under Construction</h1>
        <div class="line"></div>
        <p>
            We're working on something exciting!
            Our website is currently under construction.
            Please check back soon.
        </p>
        <footer>&copy; 2026 All Rights Reserved.</footer>
    </main>
</body>
</html>
